# Serves the production build of the app (`npm run build`).

# nginx has shipped the WASM media type since 1.21.1; declaring it here keeps a
# `.wasm` served as `application/wasm` even on an older or trimmed mime.types,
# which the browser's streaming compiler insists on.
types {
    application/wasm wasm;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The engine is a ~60 MB `.wasm`; it and the JS/CSS are pre-compressed at
    # image build time, so nginx hands out the stored `.gz` instead of spending
    # CPU on every request. `gzip` covers anything that was not pre-compressed.
    gzip_static on;
    gzip        on;
    gzip_vary   on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    tcp_nopush on;

    # Vite fingerprints everything under /assets, so a URL's content never
    # changes: cache it for a year and skip revalidation altogether.
    location /assets/ {
        include /etc/nginx/snippets/cross-origin-isolation.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry point names those fingerprints, so it must never be stale.
    # `no-cache` still allows a 304 off the ETag.
    location = /index.html {
        include /etc/nginx/snippets/cross-origin-isolation.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is a static file at the root (favicon, robots.txt, ...).
    # There is no client-side router, so an unknown path is a real 404 rather
    # than a route to hand back to the app.
    location / {
        include /etc/nginx/snippets/cross-origin-isolation.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
