# Headers every response must carry.
#
# `add_header` in a location replaces — rather than extends — the set inherited
# from the enclosing block, so this snippet is included in each location instead
# of being declared once at the server level.

# SharedArrayBuffer (the engine's pthreads) is only handed out to a
# cross-origin-isolated page. Without these two headers the WASM module fails to
# start; `initWasm()` reports it as a missing `crossOriginIsolated`.
add_header Cross-Origin-Opener-Policy   same-origin  always;
add_header Cross-Origin-Embedder-Policy require-corp always;
# Isolation also means every subresource must opt in to being loaded here.
add_header Cross-Origin-Resource-Policy same-origin  always;

add_header X-Content-Type-Options nosniff  always;
add_header Referrer-Policy        no-referrer always;
