<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QLeverUI</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-sm sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">
          <span class="text-green-accent">QLever</span>
          <span class="text-gray-400 text-sm font-normal ml-2">WebAssembly</span>
        </h1>
        <div class="flex items-center gap-4">
          <label for="datasetSelect" class="text-sm text-gray-400">Dataset</label>
          <select
            id="datasetSelect"
            class="bg-gray-800 border border-gray-700 text-gray-100 text-sm rounded-md px-3 py-2 focus:outline-none focus:border-green-accent"
          >
            <option value="">-- Select index --</option>
            <option value="House">House</option>
            <option value="Olympics">Olympics</option>
            <option value="IRI-resolution">IRI-resolution</option>
            <option value="TBBT">The Big Bang Theory</option>
          </select>
          <span id="statusIndicator" class="text-sm text-gray-500"></span>
        </div>
      </div>
    </header>

    <!-- Build Index from file -->
    <div class="max-w-5xl mx-auto px-6 pt-8">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
        <h2 class="text-lg font-semibold text-gray-200">Build Index</h2>
        <p class="text-sm text-gray-400">Upload an RDF file or paste RDF data directly to build a local index.</p>

        <!-- File upload -->
        <div class="flex items-center gap-4 flex-wrap">
          <input
            type="file"
            id="indexFileInput"
            accept=".nt,.nq,.ttl,.nq.xz,.nt.xz"
            class="text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-800 file:text-gray-200 hover:file:bg-gray-700 file:cursor-pointer"
          />
        </div>

        <div class="text-center text-xs text-gray-500">— or paste RDF data below —</div>

        <!-- Inline text input -->
        <textarea
          id="indexTextInput"
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 font-mono text-sm text-gray-100 focus:outline-none focus:border-green-accent resize-y min-h-24"
          placeholder='<subject> <predicate> <object> .&#10;<http://example.org/a> <http://example.org/name> "Alice" .'
          rows="5"
        ></textarea>

        <div class="flex items-center gap-4 flex-wrap">
          <select
            id="filetypeSelect"
            class="bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-md px-3 py-2 focus:outline-none focus:border-green-accent"
          >
            <option value="Turtle">Turtle (.nt / .ttl)</option>
            <option value="NQuad">N-Quads (.nq)</option>
          </select>
          <button
            id="buildIndexBtn"
            class="bg-green-accent hover:bg-green-accent/90 text-gray-950 font-semibold px-6 py-2.5 rounded-lg transition-colors cursor-pointer"
          >
            Build Index
          </button>
          <button
            id="downloadIndexBtn"
            class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold px-6 py-2.5 rounded-lg transition-colors cursor-pointer hidden"
          >
            Download Index Files
          </button>
        </div>
        <div id="buildIndexStatus" class="text-sm text-gray-500"></div>
      </div>
    </div>

    <!-- Main content -->
    <main class="max-w-5xl mx-auto px-6 py-8 space-y-6">
      <!-- Query panel -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-200">Query</h2>
          <select
            id="queryOptions"
            class="bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-md px-3 py-2 focus:outline-none focus:border-green-accent max-w-xs"
          >
            <option value="">-- Select a preset --</option>
          </select>
        </div>

        <textarea
          id="userInput"
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 font-mono text-sm text-gray-100 focus:outline-none focus:border-green-accent resize-y min-h-32"
          placeholder="Enter SPARQL query or select a preset above..."
          rows="8"
        ></textarea>

        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-500">Ctrl+Enter to run</span>
          <button
            id="runQuery"
            class="bg-green-accent hover:bg-green-accent/90 text-gray-950 font-semibold px-6 py-2.5 rounded-lg transition-colors cursor-pointer"
          >
            Run Query
          </button>
        </div>
      </div>

      <!-- Results panel -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <h2 class="text-lg font-semibold text-gray-200 mb-4">Results</h2>
        <div id="resultContainer" class="text-gray-400 text-sm">
          Select a dataset and run a query to see results.
        </div>
      </div>

      <!-- Log panel -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-gray-200">WASM Log</h2>
          <button
            id="clearLog"
            class="text-xs text-gray-500 hover:text-gray-300 transition-colors cursor-pointer"
          >
            Clear
          </button>
        </div>
        <pre
          id="logContainer"
          class="bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 font-mono text-xs text-gray-400 overflow-auto max-h-64 whitespace-pre-wrap"
        ></pre>
      </div>
    </main>
  </body>
</html>
